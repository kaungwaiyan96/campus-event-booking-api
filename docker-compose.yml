services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_event_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-campus_events}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campus_events}"]
      interval: 5s
      timeout: 5s
    networks:
      - campus_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_event_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-campus_events}?schema=public
      KEY_VAULT_NAME: ${KEY_VAULT_NAME:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_AUDIENCE: ${AZURE_AD_AUDIENCE:-}
      PEER_API_KEY: ${PEER_API_KEY:-campus_events_sec_key_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_campus_jwt_key_2026}
      CAMPUS_LATITUDE: ${CAMPUS_LATITUDE:-13.7563}
      CAMPUS_LONGITUDE: ${CAMPUS_LONGITUDE:-100.5018}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus_network

volumes:
  postgres_data:
    driver: local

networks:
  campus_network:
    driver: bridge
