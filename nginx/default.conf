# Nginx Reverse Proxy Configuration
# Fulfills Course Requirement:
# Deployed under a new, distinct URL path (/events-api) without breaking
# existing /content (WordPress) or /api (Lab) routes.

server {
    listen 80;
    listen [::]:80;
    server_name campus-event-api.southeastasia.cloudapp.azure.com;

    # Redirect all HTTP requests to HTTPS (Managed by Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-event-api.southeastasia.cloudapp.azure.com;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/campus-event-api.southeastasia.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-event-api.southeastasia.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # =========================================================================
    # 1. Existing Routes (Protected - DO NOT REMOVE OR OVERWRITE)
    # =========================================================================
    # Existing WordPress / Content route
    location /content {
        try_files $uri $uri/ /index.php?$args;
    }

    # Existing Lab / Base API route
    location /api {
        proxy_pass http://localhost:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # 2. Campus Event Management & Booking API (Member 1 New Distinct Path)
    # =========================================================================
    location /events-api/ {
        # Proxy to Docker container or local Node.js process on port 5000
        proxy_pass http://127.0.0.1:5000/events-api/;
        
        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Performance & Timeout settings
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
